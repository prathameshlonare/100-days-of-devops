services:
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment: ["API_URL=http://backend:4000"]
    networks: [frontend-net]
    depends_on: [backend]
  backend:
    build: ./backend
    ports: ["4000:4000"]
    volumes: [voting-data:/data]
    networks: [frontend-net, backend-net]
    depends_on: [db]
  db:
    image: busybox
    command: ["sleep","infinity"]
    volumes: [voting-data:/data]
    networks: [backend-net]

networks:
  frontend-net:
  backend-net:
volumes:
  voting-data: